; =============================================================================
; DMS PT INDRACO overrides (later values win over the defaults above)
; The launcher rebuilds php.ini on every start as:
;   php.ini = php.ini-production + evironment\php-dms.ini
; so edit THIS file, never php.ini directly.
; =============================================================================
[PHP]
extension_dir = "ext"
extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = zip

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = Asia/Jakarta

[opcache]
zend_extension = opcache
opcache.enable = 1
; CLI (artisan) off: with the shared file cache + revalidate_freq, artisan read a stale
; bootstrap/cache/config.php right after config:cache (seen in testing). Web workers keep OPcache.
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.save_comments = 1
; Production tuning: stat() each file at most once per 60 s. The launcher restarts
; the php-cgi pool on START / UPDATE-AND-RESTART, which reloads new code immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; Windows ASLR: a worker that cannot map the shared memory falls back to the file cache.
opcache.file_cache = "${TEMP}"
opcache.file_cache_fallback = 1
; JIT off: measured on 2 cores, 3 workers, 30 users: p95 34.8 ms without JIT vs
; 39.3 ms with JIT 1255 (Laravel requests are framework/IO bound), and 64 MB less memory.
opcache.jit = disable
opcache.jit_buffer_size = 0
